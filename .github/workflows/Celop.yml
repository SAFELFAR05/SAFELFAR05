name: ELFAR-DESKTOP

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 360
    
    steps:
      - name: Downloading & Installing Essentials
        run: |
          Invoke-WebRequest -Uri "https://gist.githubusercontent.com/SAFELFAR05/25b10786fb0727d52fb9ed044c019b6f/raw/7846f25e1f377ce3084de087e59d038c0d28ae01/Downloads.bat" -OutFile "Downloads.bat"
          cmd /c Downloads.bat

      - name: Log In To AnyDesk
        run: cmd /c show.bat

      - name: Time Counter
        run: python time.py
